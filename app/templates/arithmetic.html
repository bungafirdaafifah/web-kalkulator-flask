{% extends 'base.html' %}

{% block content %}
<div class="max-w-3xl mx-auto">
    <div class="mb-8 flex items-center space-x-4">
        <a href="{{ url_for('index') }}" class="p-2 bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 transition">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-slate-600 dark:text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
        </a>
        <h1 class="text-3xl font-bold text-slate-900 dark:text-white">Operasi Aritmatika</h1>
    </div>

    <div class="bg-white dark:bg-slate-800 rounded-3xl shadow-xl border border-slate-100 dark:border-slate-700 overflow-hidden">
        <div class="p-8">
            <div class="grid grid-cols-1 gap-6">
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Input Angka</label>
                    <div class="flex space-x-4">
                        <input id="a" type="number" placeholder="Angka Pertama (a)" class="flex-1 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 transition text-slate-900 dark:text-white">
                        <input id="b" type="number" placeholder="Angka Kedua (b)" class="flex-1 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 transition text-slate-900 dark:text-white">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Pilih Operasi</label>
                    <select id="arith-op" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 transition appearance-none text-slate-900 dark:text-white">
                        <option value="add">Tambah (+)</option>
                        <option value="sub">Kurang (-)</option>
                        <option value="mul">Kali (×)</option>
                        <option value="div">Bagi (÷)</option>
                        <option value="pow">Pangkat (a^b)</option>
                        <option value="root">Akar ke-b dari a (ⁿ√a)</option>
                        <option value="mod">Modulus (%)</option>
                        <option value="floordiv">Floor Division (//)</option>
                    </select>
                </div>

                <button id="calc-arith" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-200 dark:shadow-none transition-all active:scale-[0.98]">
                    Hitung Sekarang
                </button>
            </div>
        </div>

        <div id="arith-res-container" class="bg-slate-50 dark:bg-slate-900/50 p-8 border-t border-slate-100 dark:border-slate-700 hidden">
            <div id="arith-res"></div>
        </div>
    </div>
</div>
{% endblock %}
