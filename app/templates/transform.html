{% extends 'base.html' %}

{% block content %}
<div class="max-w-4xl mx-auto space-y-8">
    <div class="mb-8 flex items-center space-x-4">
        <a href="{{ url_for('index') }}" class="p-2 bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 transition">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-slate-600 dark:text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
        </a>
        <h1 class="text-3xl font-bold text-slate-900 dark:text-white">Transformasi Bilangan</h1>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <!-- Base Conversion -->
        <div class="bg-white dark:bg-slate-800 p-6 rounded-3xl shadow-sm border border-slate-100 dark:border-slate-700">
            <h2 class="text-xl font-bold text-slate-900 dark:text-white mb-4 flex items-center">
                <span class="w-8 h-8 bg-purple-50 dark:bg-purple-900/30 text-purple-600 dark:text-purple-400 rounded-lg flex items-center justify-center mr-3 text-sm">01</span>
                Konversi Basis
            </h2>
            <div class="space-y-4">
                <input id="cval" placeholder="Nilai (cth: 255)" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2 focus:outline-none focus:ring-2 focus:ring-purple-500 transition text-slate-900 dark:text-white text-sm">
                <div class="grid grid-cols-2 gap-4">
                    <select id="cfrom" class="bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-900 dark:text-white">
                        <option value="10">Decimal</option>
                        <option value="2">Binary</option>
                        <option value="8">Octal</option>
                        <option value="16">Hex</option>
                    </select>
                    <select id="cto" class="bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-900 dark:text-white">
                        <option value="2">To Binary</option>
                        <option value="8">To Octal</option>
                        <option value="16">To Hex</option>
                        <option value="10">To Decimal</option>
                    </select>
                </div>
                <button id="conv-base" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-semibold py-2 rounded-xl transition">Konversi</button>
                <div id="conv-base-res-container" class="mt-4 p-4 bg-slate-50 dark:bg-slate-900 rounded-xl border border-slate-100 dark:border-slate-700 hidden">
                    <div id="conv-base-res-area"></div>
                </div>
            </div>
        </div>

        <!-- Temperature Conversion -->
        <div class="bg-white dark:bg-slate-800 p-6 rounded-3xl shadow-sm border border-slate-100 dark:border-slate-700">
            <h2 class="text-xl font-bold text-slate-900 dark:text-white mb-4 flex items-center">
                <span class="w-8 h-8 bg-orange-50 dark:bg-orange-900/30 text-orange-600 dark:text-orange-400 rounded-lg flex items-center justify-center mr-3 text-sm">02</span>
                Konversi Suhu
            </h2>
            <div class="space-y-4">
                <input id="tval" type="number" placeholder="Nilai suhu" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2 focus:outline-none focus:ring-2 focus:ring-orange-500 transition text-slate-900 dark:text-white text-sm">
                <div class="grid grid-cols-2 gap-4">
                    <select id="tfrom" class="bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-900 dark:text-white">
                        <option value="C">Celsius</option>
                        <option value="F">Fahrenheit</option>
                        <option value="K">Kelvin</option>
                        <option value="R">Reamur</option>
                    </select>
                    <select id="tto" class="bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-900 dark:text-white">
                        <option value="F">Fahrenheit</option>
                        <option value="C">Celsius</option>
                        <option value="K">Kelvin</option>
                        <option value="R">Reamur</option>
                    </select>
                </div>
                <button id="conv-temp" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-semibold py-2 rounded-xl transition">Konversi</button>
                <div id="conv-temp-res-container" class="mt-4 p-4 bg-slate-50 dark:bg-slate-900 rounded-xl border border-slate-100 dark:border-slate-700 hidden">
                    <div id="conv-temp-res-area"></div>
                </div>
            </div>
        </div>

        <!-- Currency Conversion -->
        <div class="bg-white dark:bg-slate-800 p-6 rounded-3xl shadow-sm border border-slate-100 dark:border-slate-700">
            <h2 class="text-xl font-bold text-slate-900 dark:text-white mb-4 flex items-center">
                <span class="w-8 h-8 bg-emerald-50 dark:bg-emerald-900/30 text-emerald-600 dark:text-emerald-400 rounded-lg flex items-center justify-center mr-3 text-sm">03</span>
                Mata Uang
            </h2>
            <div class="space-y-4">
                <input id="mval" type="number" placeholder="Jumlah uang" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition text-slate-900 dark:text-white text-sm">
                <div class="grid grid-cols-2 gap-4">
                    <select id="mfrom" class="bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-900 dark:text-white">
                        <option value="IDR">IDR</option>
                        <option value="USD">USD</option>
                        <option value="EUR">EUR</option>
                        <option value="SGD">SGD</option>
                    </select>
                    <select id="mto" class="bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-900 dark:text-white">
                        <option value="USD">USD</option>
                        <option value="EUR">EUR</option>
                        <option value="SGD">SGD</option>
                        <option value="IDR">IDR</option>
                    </select>
                </div>
                <button id="conv-money" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 rounded-xl transition">Konversi</button>
                <div id="conv-money-res-container" class="mt-4 p-4 bg-slate-50 dark:bg-slate-900 rounded-xl border border-slate-100 dark:border-slate-700 hidden">
                    <div id="conv-money-res-area"></div>
                </div>
            </div>
        </div>

        <!-- Series -->
        <div class="bg-white dark:bg-slate-800 p-6 rounded-3xl shadow-sm border border-slate-100 dark:border-slate-700">
            <h2 class="text-xl font-bold text-slate-900 dark:text-white mb-4 flex items-center">
                <span class="w-8 h-8 bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 rounded-lg flex items-center justify-center mr-3 text-sm">04</span>
                Faktorial & Fibonacci
            </h2>
            <div class="space-y-6">
                <div>
                    <div class="flex space-x-2">
                        <input id="fval" type="number" placeholder="n!" class="flex-1 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 transition text-slate-900 dark:text-white text-sm">
                        <button id="calc-fact" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-sm font-semibold">Hitung</button>
                    </div>
                    <div id="calc-fact-res-container" class="mt-4 p-4 bg-slate-50 dark:bg-slate-900 rounded-xl border border-slate-100 dark:border-slate-700 hidden">
                        <div id="calc-fact-res-area"></div>
                    </div>
                </div>
                <div class="border-t dark:border-slate-700 pt-4">
                    <div class="flex space-x-2">
                        <input id="fn" type="number" placeholder="n Fibonacci" class="flex-1 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 transition text-slate-900 dark:text-white text-sm">
                        <button id="calc-fib" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-sm font-semibold">Generate</button>
                    </div>
                    <div id="calc-fib-res-container" class="mt-4 p-4 bg-slate-50 dark:bg-slate-900 rounded-xl border border-slate-100 dark:border-slate-700 hidden">
                        <div id="calc-fib-res-area"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
