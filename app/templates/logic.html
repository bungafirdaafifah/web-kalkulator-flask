{% extends 'base.html' %}

{% block content %}
<div class="max-w-3xl mx-auto">
    <div class="mb-8 flex items-center space-x-4">
        <a href="{{ url_for('index') }}" class="p-2 bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 transition">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-slate-600 dark:text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
        </a>
        <h1 class="text-3xl font-bold text-slate-900 dark:text-white">Operator Logika</h1>
    </div>

    <div class="bg-white dark:bg-slate-800 rounded-3xl shadow-xl border border-slate-100 dark:border-slate-700 overflow-hidden">
        <div class="p-8">
            <div class="grid grid-cols-1 gap-6">
                <div class="bg-amber-50 dark:bg-amber-900/20 border border-amber-100 dark:border-amber-900/30 p-4 rounded-xl text-amber-800 dark:text-amber-200 text-sm">
                    <p><strong>Info:</strong> Operasi logika ini bekerja pada nilai Boolean (True/False).</p>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Input Logika (Boolean)</label>
                    <div class="flex space-x-4">
                        <select id="la" class="flex-1 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition text-slate-900 dark:text-white">
                            <option value="true">True</option>
                            <option value="false">False</option>
                        </select>
                        <select id="lb" class="flex-1 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition text-slate-900 dark:text-white">
                            <option value="true">True</option>
                            <option value="false">False</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Pilih Gerbang Logika</label>
                    <select id="logic-op" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition appearance-none text-slate-900 dark:text-white">
                        <option value="and">AND</option>
                        <option value="or">OR</option>
                        <option value="not">NOT (Hanya A)</option>
                        <option value="xor">XOR</option>
                        <option value="nand">NAND</option>
                        <option value="nor">NOR</option>
                    </select>
                </div>

                <button id="calc-logic" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-indigo-200 dark:shadow-none transition-all active:scale-[0.98]">
                    Eksekusi Logika
                </button>
            </div>
        </div>

        <div id="logic-res-container" class="bg-slate-50 dark:bg-slate-900/50 p-8 border-t border-slate-100 dark:border-slate-700 hidden">
            <div id="logic-res"></div>
        </div>
    </div>
</div>
{% endblock %}
